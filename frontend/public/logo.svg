<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- rounded-square app-icon background: cream / sand -->
  <rect x="0" y="0" width="200" height="200" rx="46" fill="#F5F0E8" />

  <!-- H: left leg + crossbar (navy). The right leg is shared with the S's spine below. -->
  <rect x="50" y="64" width="22" height="88" rx="11" fill="#1E3A5F" />
  <rect x="50" y="93" width="70" height="22" rx="11" fill="#1E3A5F" />

  <!-- S upper hook: navy, part of the lettermark -->
  <path d="M 122 60 A 24 24 0 0 1 122 108"
        fill="none" stroke="#1E3A5F" stroke-width="22" stroke-linecap="round" />

  <!-- S lower hook, continuing into a winding road: terracotta -->
  <path d="M 122 108 A 24 24 0 0 0 122 156 Q 138 162 148 170"
        fill="none" stroke="#C2410C" stroke-width="22" stroke-linecap="round" />

  <!-- dashed centerline on the road segment -->
  <path d="M 122 108 A 24 24 0 0 0 122 156 Q 138 162 148 170"
        fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="8 9" />

  <!-- small 4-point sparkle star, tucked into the curve of the S -->
  <path d="M146,56 L143.7,61.7 L138,64 L143.7,66.3 L146,72 L148.3,66.3 L154,64 L148.3,61.7 Z"
        fill="#EA580C" />
</svg>
