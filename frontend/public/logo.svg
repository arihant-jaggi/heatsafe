<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- rounded-square app-icon background: cream / sand -->
  <rect x="0" y="0" width="200" height="200" rx="46" fill="#F5F0E8" />

  <!-- H: left leg + crossbar (navy). The right leg is shared with the S's spine below. -->
  <rect x="50" y="64" width="22" height="88" rx="11" fill="#1E3A5F" />
  <rect x="50" y="93" width="70" height="22" rx="11" fill="#1E3A5F" />

  <!-- S upper hook: navy. Sweeps ~219° (not a plain semicircle) so the top
       terminal curls back on itself like a real S, instead of ending flat. -->
  <path d="M 106.9 65.4 A 24 24 0 1 1 122 108"
        fill="none" stroke="#1E3A5F" stroke-width="22" stroke-linecap="round" />

  <!-- S lower hook, continuing into a winding road: terracotta. Same ~219°
       over-sweep gives the bottom terminal its curl before the road tail
       continues on toward the corner. -->
  <path d="M 122 108 A 24 24 0 1 0 137.1 150.6 Q 145 158 150 162"
        fill="none" stroke="#C2410C" stroke-width="22" stroke-linecap="round" />

  <!-- dashed centerline on the road segment -->
  <path d="M 122 108 A 24 24 0 1 0 137.1 150.6 Q 145 158 150 162"
        fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="8 9" />

  <!-- 4-point sparkle star, larger and sitting clearly in the open space
       above the S's upper bulge -->
  <path d="M148,49 L145,57 L137,60 L145,63 L148,71 L151,63 L159,60 L151,57 Z"
        fill="#EA580C" />
</svg>
